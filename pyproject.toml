[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ecal-foxglove-bridge"
license = {file = "LICENSE"}
version = "0.3.0"
authors = [
  { "name" = "Eclipse eCAL Team", "email" = "ecal-dev@eclipse.org" },
]
requires-python = ">=3.8"
dependencies = [
    "foxglove-websocket >= 0.1.1",
    "packaging"
]


[project.scripts]
ecal_foxglove_bridge = "ecal_foxglove_bridge.ecal_foxglove_bridge:main"

[project.optional-dependencies]
with-eclipse-ecal = ["eclipse-ecal>=6.0.1"]

[tool.setuptools.packages.find]
where = ["."]

